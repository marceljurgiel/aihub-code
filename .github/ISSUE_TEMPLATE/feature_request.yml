name: Idea
description: Something aihub-code could do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What would you like to do?
      description: The task you have in mind, in your own words — not necessarily how aihub-code should do it.
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How could it work?
      description: Optional — a slash command, a key, a mode, a setting…
  - type: textarea
    id: now
    attributes:
      label: What do you do now instead?
      description: Optional — another tool, a workaround.
